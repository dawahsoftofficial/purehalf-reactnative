# Codemagic CI: release builds for Pure Half (React Native 0.82, bare workflow).
#
# Both workflows are started manually from the Codemagic dashboard (no
# automatic triggers) so build minutes are only spent when a release is wanted.
#
# One-time setup in Codemagic (see docs/ci/codemagic-setup.md):
#   - Environment variable group `app_env` with secure variable APP_ENV_FILE_B64:
#     the production .env file, base64-encoded (APP_DEBUG is forced to false).
#   - Android keystore uploaded under Team settings > Code signing identities,
#     reference name `purehalf_upload` (the Play upload key).
#   - GCLOUD_SERVICE_ACCOUNT_CREDENTIALS (group app_env): Play service account
#     key, used to read the latest versionCode and publish to open testing.
#   - App Store Connect API key integration named `pure_half_asc` (iOS only),
#     and variable APP_STORE_APPLE_ID in group `ios_release` (the app's
#     numeric Apple ID from App Store Connect).

definitions:
  write_env: &write_env
    name: Write .env.production from the app_env group
    script: |
      set -e
      if [ -z "$APP_ENV_FILE_B64" ]; then
        echo "APP_ENV_FILE_B64 is not set (variable group app_env)" >&2
        exit 1
      fi
      # Release bundles read .env.production (android/app/build.gradle,
      # react-native-dotenv envName APP_ENV); .env is kept identical for tools
      # that still read it.
      echo "$APP_ENV_FILE_B64" | base64 --decode > .env.production
      # Release builds must never ship the debug "Delete Test Account" row.
      sed -i.bak '/^APP_DEBUG=/d' .env.production && rm -f .env.production.bak
      echo "APP_DEBUG=false" >> .env.production
      cp .env.production .env
      echo "API base: $(grep '^API_BASE_URL=' .env.production | cut -d= -f2-)"
  install_js: &install_js
    name: Install JavaScript dependencies
    script: |
      set -e
      # The lockfile is Yarn 1 (classic). Codemagic images default to Yarn 4,
      # which rewrites the lockfile and fails, so pin Yarn 1 via Corepack.
      corepack enable
      corepack prepare yarn@1.22.22 --activate
      yarn --version
      yarn install --frozen-lockfile

workflows:
  android-release:
    name: Android release (Play upload bundle)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      groups:
        - app_env
      android_signing:
        - purehalf_upload
      node: 20
      java: 17
    scripts:
      - *write_env
      - *install_js
      - name: Release env check
        script: yarn check:release-env
      - name: Next versionCode from Google Play
        script: |
          set -e
          # Every upload needs a higher versionCode than anything already on Play,
          # so take the highest across all tracks and add 1 (never below build.gradle's).
          LATEST=$(google-play get-latest-build-number --package-name com.zojayn || echo 0)
          CURRENT=$(grep -m1 -oE 'versionCode [0-9]+' android/app/build.gradle | grep -oE '[0-9]+')
          NEXT=$(( LATEST >= CURRENT ? LATEST + 1 : CURRENT ))
          echo "Play latest: $LATEST, build.gradle: $CURRENT -> using $NEXT"
          sed -i.bak -E "s/versionCode [0-9]+/versionCode $NEXT/" android/app/build.gradle && rm -f android/app/build.gradle.bak
      - name: Build signed AAB
        script: |
          set -e
          cd android
          # Signing comes from the Codemagic keystore, passed on the command
          # line so it overrides the values in android/gradle.properties.
          ./gradlew bundleRelease \
            -PMYAPP_UPLOAD_STORE_FILE="$CM_KEYSTORE_PATH" \
            -PMYAPP_UPLOAD_STORE_PASSWORD="$CM_KEYSTORE_PASSWORD" \
            -PMYAPP_UPLOAD_KEY_ALIAS="$CM_KEY_ALIAS" \
            -PMYAPP_UPLOAD_KEY_PASSWORD="$CM_KEY_PASSWORD"
      - name: Refuse a debug-signed bundle
        script: |
          set -e
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          # build.gradle silently falls back to the debug key when the upload
          # keystore is missing; Play would reject that bundle.
          if keytool -printcert -jarfile "$AAB" | grep -q "CN=Android Debug"; then
            echo "app-release.aab is signed with the DEBUG key; check the purehalf_upload keystore" >&2
            exit 1
          fi
          keytool -printcert -jarfile "$AAB" | grep -E "Owner:|SHA256:"
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
      - android/app/build/outputs/mapping/release/mapping.txt
    # Uploads straight to Play's OPEN TESTING track ("beta" in the Play API) and
    # rolls out to testers. Needs secure variable GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
    # (group app_env): a Google Cloud service account JSON key whose account has
    # Release permission for Pure Half in Play Console.
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: beta
        submit_as_draft: false

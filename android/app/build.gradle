apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply plugin: 'com.google.gms.google-services' // Google Services
apply plugin: 'com.google.firebase.crashlytics' // Firebase Crashlytics

// Release artifacts deliberately target different environments:
//   bundleRelease   -> .env.production (Play Store AAB)
//   assembleRelease -> .env.staging    (test APK)
//
// React Native's Gradle plugin launches Metro in a child Node process. Route
// that process through a small wrapper so APP_ENV is set deterministically,
// even when the caller's shell has a different APP_ENV value.
def requestedTaskNames = gradle.startParameter.taskNames.collect {
    it.tokenize(':').last()
}
def isProductionBundle = requestedTaskNames.any {
    it.equalsIgnoreCase('bundleRelease')
}
def isStagingAssembly = requestedTaskNames.any {
    it.equalsIgnoreCase('assembleRelease')
}

if (isProductionBundle && isStagingAssembly) {
    throw new GradleException(
            'Run bundleRelease and assembleRelease separately: they use production and staging environments, respectively.'
    )
}

def releaseAppEnv = isProductionBundle ? 'production' :
        (isStagingAssembly ? 'staging' : null)
def selectedReleaseEnvFile = releaseAppEnv == null ? null :
        file("$rootDir/../.env.${releaseAppEnv}")

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    if (releaseAppEnv != null) {
        nodeExecutableAndArgs = [
                "node",
                file("../../scripts/run-with-app-env.js").absolutePath,
                releaseAppEnv,
        ]
    }

    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
    // For react-native-vector-icons
    apply from: file("../../node_modules/react-native-vector-icons/fonts.gradle")
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'
def releaseKeystoreFile = project.hasProperty('MYAPP_UPLOAD_STORE_FILE') ? file(MYAPP_UPLOAD_STORE_FILE) : null
def releaseSigningConfigured = releaseKeystoreFile != null &&
        releaseKeystoreFile.exists() &&
        project.hasProperty('MYAPP_UPLOAD_STORE_PASSWORD') &&
        project.hasProperty('MYAPP_UPLOAD_KEY_ALIAS') &&
        project.hasProperty('MYAPP_UPLOAD_KEY_PASSWORD')

if (!releaseSigningConfigured) {
    logger.warn("Release signing is not configured; assembleRelease will use the debug keystore for local install testing.")
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.zojayn"
    defaultConfig {
        applicationId "com.zojayn"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 80
        versionName "4.0"
    }

    configurations.all {
        exclude group: 'com.android.support'
        resolutionStrategy {
            force 'androidx.core:core:1.16.0'
            force 'androidx.core:core-ktx:1.16.0'
        }
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (releaseSigningConfigured) {
                storeFile releaseKeystoreFile
                storePassword MYAPP_UPLOAD_STORE_PASSWORD
                keyAlias MYAPP_UPLOAD_KEY_ALIAS
                keyPassword MYAPP_UPLOAD_KEY_PASSWORD
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            /* Add the firebaseCrashlytics extension (by default,
            * it's disabled to improve build speeds) and set
            * nativeSymbolUploadEnabled to true along with a pointer to native libs. */
            firebaseCrashlytics {
                nativeSymbolUploadEnabled true
                unstrippedNativeLibsDir 'build/intermediates/merged_native_libs/release/out/lib'
            }
            signingConfig releaseSigningConfigured ? signingConfigs.release : signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    // Required for react-native-image-picker on Android API levels below 30
    implementation("androidx.activity:activity:1.9.+")
}

// Always show which environment is being bundled. This also blocks indirect
// release invocations (for example `gradlew build`) whose artifact type is
// ambiguous and therefore cannot safely select staging vs production.
tasks.register("confirmReleaseEnvironment") {
    description = "Confirms the environment selected for an Android release artifact."
    doLast {
        if (releaseAppEnv == null) {
            throw new GradleException(
                    'Release environment is ambiguous. Run bundleRelease for production or assembleRelease for staging.'
            )
        }
        if (!selectedReleaseEnvFile.exists()) {
            throw new GradleException(
                    "Missing release environment file: ${selectedReleaseEnvFile.absolutePath}"
            )
        }
        logger.lifecycle(
                "Release environment selected: .env.${releaseAppEnv} (${isProductionBundle ? 'AAB' : 'APK'})"
        )
    }
}

// Production bundles must never include the debug-only Settings row. Staging
// APKs intentionally enable it, so this check only applies to bundleRelease.
tasks.register("checkReleaseEnv", Exec) {
    description = "Fails a production bundle if .env.production enables APP_DEBUG."
    commandLine "node",
            file("$rootDir/../scripts/check-release-env.js").absolutePath,
            file("$rootDir/../.env.production").absolutePath
}

// Put the guards directly in front of Metro so a missing/unsafe env file is
// caught before any JavaScript bundle can be generated.
tasks.matching { it.name == "createBundleReleaseJsAndAssets" }.configureEach {
    dependsOn(tasks.named("confirmReleaseEnvironment"))
    if (releaseAppEnv == 'production') {
        dependsOn(tasks.named("checkReleaseEnv"))
    }
}

// A release *bundle* (the .aab uploaded to Play) must never be debug-signed.
// assembleRelease may still fall back to the debug keystore for local install
// testing, but bundleRelease is refused unless the upload keystore is
// configured — otherwise a debug-signed AAB would silently ship.
tasks.register("checkReleaseSigning") {
    description = "Fails a release bundle build if the upload keystore isn't configured."
    doFirst {
        if (!releaseSigningConfigured) {
            throw new GradleException(
                "Release signing is not configured (MYAPP_UPLOAD_STORE_FILE / _STORE_PASSWORD / " +
                "_KEY_ALIAS / _KEY_PASSWORD). Refusing to build a release bundle that would be signed " +
                "with the debug keystore. Set the upload keystore properties in gradle.properties " +
                "(or via CI) and rebuild."
            )
        }
    }
}

tasks.matching { it.name.matches(/bundle.*Release/) }.configureEach {
    dependsOn(tasks.named("checkReleaseSigning"))
}
